<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Asistente de servicio técnico</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, sans-serif;
        background: #f3f5f8;
        color: #172033;
      }

      body {
        box-sizing: border-box;
        display: grid;
        min-height: 100vh;
        margin: 0;
        padding: 1rem;
        place-items: center;
      }

      main {
        display: flex;
        width: min(100%, 48rem);
        height: min(90vh, 46rem);
        flex-direction: column;
        overflow: hidden;
        border: 1px solid #d8deea;
        border-radius: 1rem;
        background: #fff;
        box-shadow: 0 1rem 3rem #17203312;
      }

      header,
      form {
        padding: 1rem 1.25rem;
      }

      header {
        border-bottom: 1px solid #e7eaf0;
      }

      h1 {
        margin: 0 0 .35rem;
        font-size: 1.2rem;
      }

      header p {
        margin: 0;
        color: #536078;
        font-size: .9rem;
      }

      #messages {
        display: flex;
        flex: 1;
        flex-direction: column;
        gap: .75rem;
        overflow-y: auto;
        padding: 1rem 1.25rem;
      }

      .message {
        max-width: 85%;
        margin: 0;
        padding: .7rem .85rem;
        border-radius: .85rem;
        line-height: 1.45;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      .assistant {
        align-self: flex-start;
        background: #eef2f8;
      }

      .user {
        align-self: flex-end;
        background: #2458c6;
        color: #fff;
      }

      form {
        display: grid;
        gap: .65rem;
        border-top: 1px solid #e7eaf0;
      }

      label {
        display: grid;
        gap: .3rem;
        color: #536078;
        font-size: .85rem;
      }

      input,
      button {
        box-sizing: border-box;
        width: 100%;
        border: 1px solid #c9d1df;
        border-radius: .6rem;
        padding: .7rem .8rem;
        font: inherit;
      }

      #message-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: .6rem;
      }

      button {
        width: auto;
        border-color: #2458c6;
        background: #2458c6;
        color: white;
        cursor: pointer;
      }

      button:disabled {
        cursor: wait;
        opacity: .65;
      }

      #status {
        min-height: 1.2rem;
        margin: 0;
        color: #9d2e2e;
        font-size: .85rem;
      }

      @media (max-width: 34rem) {
        body {
          padding: 0;
        }

        main {
          width: 100%;
          height: 100vh;
          border: 0;
          border-radius: 0;
        }

        #message-row {
          grid-template-columns: 1fr;
        }

        button {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Asistente de servicio técnico</h1>
        <p>
          Describe la falla y usa el email de un cliente activo registrado.
          El email solo identifica, no autentica.
        </p>
      </header>
      <section id="messages" aria-live="polite" aria-label="Conversación">
        <p class="message assistant">Hola. ¿Qué problema presenta tu equipo?</p>
      </section>
      <form id="chat-form">
        <label>
          Email del cliente activo registrado
          <input id="email" name="email" type="email" maxlength="254" required>
        </label>
        <label for="message">Mensaje</label>
        <div id="message-row">
          <input
            id="message"
            name="message"
            type="text"
            maxlength="4000"
            autocomplete="off"
            placeholder="Ej.: Mi laptop se calienta y se apaga"
            required
          >
          <button id="send" type="submit">Enviar</button>
        </div>
        <p id="status" role="status"></p>
      </form>
    </main>
    <script>
      const form = document.querySelector("#chat-form");
      const emailInput = document.querySelector("#email");
      const messageInput = document.querySelector("#message");
      const sendButton = document.querySelector("#send");
      const messages = document.querySelector("#messages");
      const status = document.querySelector("#status");
      const sessionId = crypto.randomUUID();

      function addMessage(role, text) {
        const item = document.createElement("p");
        item.className = `message ${role}`;
        item.textContent = text;
        messages.append(item);
        messages.scrollTop = messages.scrollHeight;
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const message = messageInput.value.trim();
        const email = emailInput.value.trim();
        if (!message || !email) return;

        addMessage("user", message);
        messageInput.value = "";
        status.textContent = "";
        sendButton.disabled = true;

        try {
          const response = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ session_id: sessionId, email, message }),
          });
          const payload = await response.json();
          if (!response.ok) {
            throw new Error(payload.detail || "No se pudo enviar el mensaje.");
          }
          addMessage("assistant", payload.answer);
        } catch (error) {
          status.textContent = error.message;
        } finally {
          sendButton.disabled = false;
          messageInput.focus();
        }
      });
    </script>
  </body>
</html>
